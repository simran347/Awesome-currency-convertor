<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link href="project.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
      <div class="exchange">
     <h1><i>Exchange currency rates widget</i></h1>
     <br>
    <div class="container">
      <div class="top-options">
        <div id="dateTime" class="date-time"></div>
        <select id="language" aria-label="Select language">
        </select>
      </div>
      <h2>Currency Converter</h2>
      <form>
        <div class="amount">
          <p>Enter Amount</p>
          <input value="1" type="number" min="0" step="any" />
        </div>
        <div class="dropdown">
          <div class="from">
            <p>From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" />
              <select name="from"></select>
            </div>
          </div>
          <i class="fa-solid fa-arrow-right-arrow-left"></i>
          <div class="to">
            <p>To</p>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" />
              <select name="to"></select>
            </div>
          </div>
        </div>
        <div class="msg" role="status" aria-live="polite">Enter an amount and click Get Exchange Rate.</div>
        <button>Get Exchange Rate</button>
        <button type="button" class="currency-preview-button" id="showCurrency">See country currency</button>
      </form>
      <div class="currency-preview" id="currencyPreview" hidden>
        <p id="currencyPreviewTitle">Country currency</p>
        <img id="currencyPreviewImage" alt="Selected currency country" />
        <span id="currencyPreviewCode"></span>
      </div>
    </div>
    </div>
    <script src="project.js"></script>
  </body>
</html>
